name: Refresh card data

# New cards appear in the master database every week or so. This rebuilds data/*.json
# and commits it only when something actually changed. Run it by hand from the
# Actions tab at any time ("Run workflow").
on:
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed data
  pages: write # ask Pages to rebuild afterwards

concurrency:
  group: refresh-card-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only cards that are new since the last run get their art checked on the image host.
      - name: Rebuild data from the Sekai-World master database
        run: node scripts/build-data.mjs --verify-images

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Card data is already up to date."
            exit 0
          fi
          cards=$(node -p "require('./data/cards.json').meta.cards")
          latest=$(node -p "require('./data/cards.json').meta.latestCard")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Refresh card data: $cards cards, latest release $latest"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the workflow token don't always start a Pages build, so ask for one.
      - name: Publish the update
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/builds"
